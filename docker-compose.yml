services:
  db:
    image: postgres:16-alpine
    container_name: climb_db
    environment:
      POSTGRES_DB: climbgym
      POSTGRES_USER: climber
      POSTGRES_PASSWORD: chalk123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climber -d climbgym"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: climb_backend
    environment:
      DATABASE_URL: postgresql://climber:chalk123@db:5432/climbgym
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: climb_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
